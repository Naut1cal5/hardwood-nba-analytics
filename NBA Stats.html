<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1440" />
<title>Hardwood — NBA Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #0a0a0c;
    --bg-2: #0f0f12;
    --surface: #16161a;
    --surface-2: #1c1c22;
    --line: rgba(255,255,255,0.06);
    --line-2: rgba(255,255,255,0.10);
    --text: #f2f2f5;
    --text-2: #a9a9b2;
    --text-3: #6d6d78;
    --accent: #0A84FF;
    --accent-dim: rgba(10,132,255,0.18);
    --ember: #FF9F0A;
    --good: #30D158;
    --bad: #FF453A;
    --radius: 14px;
    --radius-lg: 20px;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    --mono: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    color: var(--text);
    font-family: var(--font);
    font-feature-settings: "ss01","cv11","tnum";
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* Desktop wallpaper to frame the window */
  body {
    min-height: 100vh;
    background:
      radial-gradient(1200px 800px at 15% 10%, #1a1f2e 0%, transparent 55%),
      radial-gradient(900px 700px at 85% 90%, #14161d 0%, transparent 60%),
      linear-gradient(180deg, #050507 0%, #0a0b10 100%);
    padding: 28px;
  }

  .window {
    width: 1384px;
    margin: 0 auto;
    border-radius: 16px;
    overflow: hidden;
    background: var(--bg);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow:
      0 40px 120px rgba(0,0,0,0.6),
      0 8px 30px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.05);
  }

  .titlebar {
    height: 44px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 14px;
    background: linear-gradient(180deg, #1a1a1f 0%, #111114 100%);
    border-bottom: 1px solid var(--line);
    position: relative;
  }
  .traffic { display: flex; gap: 8px; }
  .traffic .dot {
    width: 12px; height: 12px; border-radius: 50%;
    box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.4);
  }
  .traffic .c { background: #FF5F57; }
  .traffic .m { background: #FEBC2E; }
  .traffic .x { background: #28C840; }

  .title-center {
    position: absolute; left: 50%; transform: translateX(-50%);
    font-size: 13px; color: var(--text-2); font-weight: 500;
    display: flex; align-items: center; gap: 8px;
  }
  .title-center .logo {
    width: 16px; height: 16px; border-radius: 4px;
    background: linear-gradient(135deg, #2a2a30, #0a0a0c);
    border: 1px solid rgba(255,255,255,0.1);
    display:inline-flex;align-items:center;justify-content:center;
    font-size: 10px; color: var(--accent); font-weight: 700;
  }

  .title-right {
    margin-left: auto; display: flex; gap: 8px; align-items: center;
    font-size: 11px; color: var(--text-3); font-family: var(--mono);
  }
  .pulse-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--ember);
    box-shadow: 0 0 0 0 rgba(255,159,10,0.6);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255,159,10,0.5); }
    70% { box-shadow: 0 0 0 6px rgba(255,159,10,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,159,10,0); }
  }

  .app {
    display: grid;
    grid-template-columns: 220px 1fr;
    min-height: 900px;
  }

  /* ── Sidebar ──────────────────────────────────────── */
  .sidebar {
    background: linear-gradient(180deg, #111114 0%, #0b0b0e 100%);
    border-right: 1px solid var(--line);
    padding: 18px 12px;
    display: flex; flex-direction: column;
    gap: 6px;
  }
  .side-section {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-3);
    padding: 14px 10px 6px;
    font-weight: 600;
  }
  .side-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 8px;
    font-size: 13px; color: var(--text-2);
    cursor: pointer; transition: all 0.18s ease;
    user-select: none;
  }
  .side-item:hover { background: rgba(255,255,255,0.04); color: var(--text); }
  .side-item.active {
    background: rgba(10,132,255,0.14);
    color: #eaf3ff;
    box-shadow: inset 0 0 0 1px rgba(10,132,255,0.25);
  }
  .side-item .icon {
    width: 16px; height: 16px; display:inline-flex; align-items:center; justify-content:center;
    color: currentColor; opacity: 0.85;
  }
  .side-item .count {
    margin-left: auto; font-family: var(--mono); font-size: 10px;
    color: var(--text-3);
  }
  .side-item.active .count { color: var(--accent); }

  .side-footer {
    margin-top: auto; padding: 10px;
    display: flex; align-items: center; gap: 10px;
    border-top: 1px solid var(--line);
  }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(135deg, #3a3a42, #1a1a1f);
    border: 1px solid var(--line-2);
    display:flex;align-items:center;justify-content:center;
    font-size: 11px; font-weight: 600; color: var(--text);
  }
  .side-footer .meta { font-size: 11px; }
  .side-footer .meta .n { color: var(--text); font-weight: 500; }
  .side-footer .meta .s { color: var(--text-3); font-family: var(--mono); font-size: 10px; }

  /* ── Main ─────────────────────────────────────────── */
  .main {
    background:
      radial-gradient(800px 400px at 70% -10%, rgba(10,132,255,0.04) 0%, transparent 60%),
      var(--bg);
    overflow: hidden;
    position: relative;
  }

  .topbar {
    height: 52px;
    display: flex; align-items: center;
    padding: 0 24px;
    gap: 18px;
    border-bottom: 1px solid var(--line);
    background: rgba(14,14,17,0.7);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    position: sticky; top: 0; z-index: 10;
  }
  .crumbs { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-2); }
  .crumbs .sep { color: var(--text-3); }
  .crumbs .cur { color: var(--text); font-weight: 500; }
  .search {
    margin-left: auto;
    width: 260px; height: 30px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--line);
    border-radius: 8px;
    display: flex; align-items: center; gap: 8px;
    padding: 0 10px;
    font-size: 12px; color: var(--text-2);
  }
  .kbd {
    margin-left: auto;
    font-family: var(--mono); font-size: 10px;
    padding: 2px 5px; border-radius: 4px;
    background: rgba(255,255,255,0.06);
    color: var(--text-3);
  }
  .seg {
    display: flex; gap: 2px; padding: 2px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .seg button {
    background: transparent; border: 0;
    color: var(--text-2); font-size: 11px; font-weight: 500;
    padding: 4px 10px; border-radius: 6px; cursor: pointer;
    font-family: inherit;
  }
  .seg button.on {
    background: rgba(255,255,255,0.08);
    color: var(--text);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
  }

  .content {
    padding: 24px;
    display: grid;
    gap: 18px;
  }

  /* Material variants */
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    position: relative;
  }
  .glass .card {
    background: linear-gradient(180deg, rgba(28,28,34,0.72) 0%, rgba(18,18,22,0.72) 100%);
    backdrop-filter: blur(40px) saturate(140%);
    -webkit-backdrop-filter: blur(40px) saturate(140%);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.06),
      0 1px 0 rgba(0,0,0,0.4);
  }
  .flat .card {
    background: var(--surface);
    box-shadow: none;
  }

  .card-head {
    display: flex; align-items: center;
    padding: 16px 20px 10px;
    gap: 10px;
  }
  .card-head h3 {
    margin: 0; font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--text-3);
  }
  .card-head .sub { margin-left: auto; font-size: 11px; color: var(--text-3); font-family: var(--mono); }

  /* ── Utility classes ──────────────────────────────── */
  .row { display: flex; }
  .col { display: flex; flex-direction: column; }
  .mono { font-family: var(--mono); font-feature-settings: "tnum"; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .pos { color: var(--good); }
  .neg { color: var(--bad); }
  .dim { color: var(--text-3); }
  .hairline { height: 1px; background: var(--line); }

  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 8px; border-radius: 999px;
    font-size: 10px; font-family: var(--mono);
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--line);
    color: var(--text-2);
  }
  .chip.live {
    background: rgba(255,159,10,0.1);
    border-color: rgba(255,159,10,0.25);
    color: var(--ember);
  }
  .chip.blue {
    background: rgba(10,132,255,0.12);
    border-color: rgba(10,132,255,0.25);
    color: #9cc8ff;
  }

  /* Tweaks overrides */
  .twk-panel { font-family: var(--font) !important; }

  /* App data-layer UI (spinner / search / error) */
  .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--accent); animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .retry-btn { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 10px 22px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: var(--font); }
  .retry-btn:hover { filter: brightness(1.1); }
  .search-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); backdrop-filter: blur(6px); display: flex; align-items: flex-start; justify-content: center; padding-top: 120px; z-index: 1000; }
  .search-modal { width: 640px; max-width: 90vw; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 16px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,0.6); }
  .search-input { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line); color: var(--text-3); }
  .search-input input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-size: 16px; font-family: var(--font); }
  .search-results { max-height: 380px; overflow: auto; }
  .search-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 18px; border-bottom: 1px solid var(--line); }
  .search-row:hover { background: rgba(255,255,255,0.03); }
  .clickable-row:hover { background: rgba(255,255,255,0.06) !important; }
</style>
</head>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((key, val) => {
    setValues((prev) => ({ ...prev, [key]: val }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: val } }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel"
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

              role="switch" aria-checked={!!value}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>

}

function TweakText({ label, value, placeholder, onChange }) {

      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// Real NBA data layer.
//
// Every number in this app is fetched live from ESPN's free, public, key-less,
// CORS-enabled JSON API. There is NO hardcoded sports data anywhere — players,
// teams, standings, leaders, game logs, live scores, box scores and win
// probability are all pulled at runtime and mapped into the shapes the UI needs.
// ─────────────────────────────────────────────────────────────────────────────

const ESPN_SITE = 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba';
const ESPN_V2   = 'https://site.api.espn.com/apis/v2/sports/basketball/nba';
const ESPN_WEB  = 'https://site.web.api.espn.com/apis/common/v3/sports/basketball/nba';

// ── tiny fetch cache (avoids hammering the API on re-render) ──────────────────
const _cache = new Map();
async function fetchJson(url, ttl = 60000, retries = 2) {
  const hit = _cache.get(url);
  const now = Date.now();
  if (hit && now - hit.t < ttl) return hit.v;
  let lastErr;
  for (let attempt = 0; attempt <= retries; attempt++) {
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status + ' — ' + url);
      const v = await res.json();
      _cache.set(url, { t: Date.now(), v });
      return v;
    } catch (e) {
      lastErr = e;
      if (attempt < retries) await new Promise((r) => setTimeout(r, 400 * (attempt + 1)));
    }
  }
  throw lastErr;
}

// ── helpers ──────────────────────────────────────────────────────────────────
const round = (v, d = 1) => (v == null || isNaN(v) ? 0 : +(+v).toFixed(d));
const pad2 = (n) => String(n).padStart(2, '0');
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(iso) {
  const d = new Date(iso);
  return MONTHS[d.getMonth()] + ' ' + pad2(d.getDate());
}
function ordinal(n) {
  if (n == null) return '—';
  const s = ['th','st','nd','rd'], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}
function percentile(value, sorted) {
  // share of the population at or below `value`
  if (!sorted.length) return 50;
  let below = 0;
  for (const v of sorted) if (v <= value) below++;
  return Math.round((below / sorted.length) * 100);
}

// ── parse the byathlete statistics endpoint into flat player rows ────────────
function parseByAthlete(payloads) {
  // payloads = array of one-or-more pages of the byathlete response
  const out = [];
  const seen = new Set();
  for (const d of payloads) {
    const nameIdx = {};
    (d.categories || []).forEach((c) => { nameIdx[c.name] = c.names || []; });
    for (const row of d.athletes || []) {
      const a = row.athlete || {};
      if (!a.id || seen.has(a.id)) continue;
      seen.add(a.id);
      const stat = {}, rank = {};
      (row.categories || []).forEach((c) => {
        const names = nameIdx[c.name] || [];
        names.forEach((n, i) => {
          if (c.values) stat[n] = c.values[i];
          if (c.ranks) rank[n] = c.ranks[i];
        });
      });
      const team = (Array.isArray(a.teams) ? a.teams[a.teams.length - 1] : a.team) || {};
      const fga = stat.fieldGoalsAttempted || 0;
      const fta = stat.freeThrowsAttempted || 0;
      const fgm = stat.fieldGoalsMade || 0;
      const tpm = stat.threePointFieldGoalsMade || 0;
      const pts = stat.points || 0;
      const tov = stat.turnovers || 0;
      const ast = stat.assists || 0;
      const ts = (fga + 0.44 * fta) > 0 ? (pts / (2 * (fga + 0.44 * fta))) * 100 : 0;
      const efg = fga > 0 ? ((fgm + 0.5 * tpm) / fga) * 100 : 0;
      out.push({
        id: a.id,
        name: a.displayName,
        short: a.shortName,
        teamAbbr: team.abbreviation || '',
        pos: (a.position && a.position.abbreviation) || '',
        headshot: (a.headshot && a.headshot.href) || null,
        gp: stat.gamesPlayed || 0,
        min: round(stat.avgMinutes),
        ppg: round(stat.avgPoints),
        rpg: round(stat.avgRebounds),
        apg: round(stat.avgAssists),
        spg: round(stat.avgSteals),
        bpg: round(stat.avgBlocks),
        topg: round(stat.avgTurnovers),
        fg: round(stat.fieldGoalPct),
        threep: round(stat.threePointFieldGoalPct),
        ft: round(stat.freeThrowPct),
        ts: round(ts), efg: round(efg),
        fgm, fga, tpm,
        tpa: stat.threePointFieldGoalsAttempted || 0,
        ftm: stat.freeThrowsMade || 0, fta,
        pts, ast, tov,
        astTo: tov > 0 ? round(ast / tov) : ast,
        rank: {
          ppg: rank.avgPoints, rpg: rank.avgRebounds, apg: rank.avgAssists,
          fg: rank.fieldGoalPct, threep: rank.threePointFieldGoalPct, ft: rank.freeThrowPct,
        },
      });
    }
  }
  return out;
}

// ── standings → conference arrays ────────────────────────────────────────────
function statVal(entry, type) {
  const s = (entry.stats || []).find((x) => x.type === type || x.name === type);
  return s ? (s.value != null ? s.value : s.displayValue) : null;
}
function parseStandings(d, teamsById) {
  const conf = {};
  for (const child of d.children || []) {
    const key = /east/i.test(child.name) ? 'east' : 'west';
    const entries = (child.standings && child.standings.entries) || [];
    conf[key] = entries.map((e) => {
      const id = e.team.id;
      const wins = +statVal(e, 'wins') || 0;
      const losses = +statVal(e, 'losses') || 0;
      const streakDisp = (e.stats.find((x) => x.type === 'streak') || {}).displayValue || '';
      const last10 = (e.stats.find((x) => x.name === 'Last Ten Games' || x.type === 'lasttengames') || {}).displayValue || '';
      return {
        id,
        abbr: e.team.abbreviation,
        name: e.team.displayName,
        shortName: e.team.shortDisplayName || e.team.name,
        logo: (teamsById[id] && teamsById[id].logo) || null,
        color: (teamsById[id] && teamsById[id].color) || null,
        w: wins, l: losses,
        pct: round(statVal(e, 'winpercent') || (wins + losses ? wins / (wins + losses) : 0), 3),
        gb: (e.stats.find((x) => x.type === 'gamesbehind') || {}).displayValue || '-',
        seed: +statVal(e, 'playoffseed') || null,
        streak: streakDisp,
        last10,
        diff: (e.stats.find((x) => x.type === 'differential') || {}).displayValue || '',
        ppg: round(statVal(e, 'avgpointsfor')),
        oppg: round(statVal(e, 'avgpointsagainst')),
      };
    }).sort((a, b) => (a.seed || 99) - (b.seed || 99));
  }
  return conf;
}

// ── game log for a player ────────────────────────────────────────────────────
function parseGameLog(d) {
  const events = d.events || {};
  const names = d.names || [];
  const idx = (n) => names.indexOf(n);
  const iMin = idx('minutes'), iReb = idx('totalRebounds'), iAst = idx('assists'),
        iPts = idx('points'), iFgPct = idx('fieldGoalPct'), iTpPct = idx('threePointPct'),
        iFg = idx('fieldGoalsMade-fieldGoalsAttempted'), iTp = idx('threePointFieldGoalsMade-threePointFieldGoalsAttempted');
  // pick the season type with the most logged games (regular season)
  let best = null, bestN = -1;
  for (const st of d.seasonTypes || []) {
    const n = (st.categories || []).reduce((a, c) => a + (c.events || []).length, 0);
    if (n > bestN) { bestN = n; best = st; }
  }
  const rows = [];
  (best ? best.categories : []).forEach((c) => {
    (c.events || []).forEach((ev) => {
      const meta = events[ev.eventId];
      if (!meta) return;
      const s = ev.stats || [];
      rows.push({
        eventId: ev.eventId,
        iso: meta.gameDate,
        d: fmtDate(meta.gameDate),
        opp: (meta.opponent && meta.opponent.abbreviation) || '',
        oppName: (meta.opponent && meta.opponent.displayName) || '',
        homeAway: meta.atVs === '@' ? 'away' : 'home',
        res: meta.gameResult,
        score: meta.score,
        teamId: meta.team && meta.team.id,
        homeTeamId: meta.homeTeamId,
        homeScore: +meta.homeTeamScore, awayScore: +meta.awayTeamScore,
        min: parseInt(s[iMin]) || 0,
        reb: +s[iReb] || 0,
        ast: +s[iAst] || 0,
        pts: +s[iPts] || 0,
        fg: round(+s[iFgPct]),
        t3: round(+s[iTpPct]),
        fgRaw: s[iFg], tpRaw: s[iTp],
      });
    });
  });
  rows.sort((a, b) => new Date(a.iso) - new Date(b.iso));
  return rows;
}

// ── pick the most relevant game from a scoreboard (live > final > upcoming) ──
function pickGame(events) {
  if (!events.length) return null;
  const live = events.filter((e) => e.competitions[0].status.type.state === 'in');
  if (live.length) return live[0];
  const post = events.filter((e) => e.competitions[0].status.type.state === 'post');
  if (post.length) return post[post.length - 1];
  return events[0];
}

// look back up to a week for the most recent completed game (so the Live screen
// always has a real box score + win-probability chart when nothing is live today)
async function findRecentFinal() {
  const fmt = (dt) => '' + dt.getFullYear() + pad2(dt.getMonth() + 1) + pad2(dt.getDate());
  for (let i = 1; i <= 7; i++) {
    const dt = new Date(); dt.setDate(dt.getDate() - i);
    try {
      const sb = await fetchJson(ESPN_SITE + '/scoreboard?dates=' + fmt(dt), 300000);
      const posts = (sb.events || []).filter((e) => e.competitions[0].status.type.state === 'post');
      if (posts.length) return posts[posts.length - 1];
    } catch (e) { /* keep looking */ }
  }
  return null;
}

// ── build the live game object from a summary payload ─────────────────────────
function parseBox(teamBlock) {
  const st = (teamBlock.statistics || [])[0] || {};
  const labels = st.names || st.labels || [];
  const li = (n) => labels.indexOf(n);
  return (st.athletes || []).map((a) => {
    const v = a.stats || [];
    const ath = a.athlete || {};
    return {
      n: ath.shortName || ath.displayName,
      p: (ath.position && ath.position.abbreviation) || '',
      starter: a.starter,
      min: v[li('MIN')] || '0',
      pts: +v[li('PTS')] || 0,
      reb: +v[li('REB')] || 0,
      ast: +v[li('AST')] || 0,
      fg: v[li('FG')] || '0-0',
      t3: v[li('3PT')] || '0-0',
      pm: parseInt((v[li('+/-')] || '0').replace('+', '')) || 0,
    };
  }).filter((p) => p.min !== '0' && p.min !== '--').slice(0, 8);
}

function parseGame(scoreEvent, summary) {
  const comp = scoreEvent.competitions[0];
  const status = comp.status;
  const competitors = comp.competitors;
  const homeC = competitors.find((c) => c.homeAway === 'home');
  const awayC = competitors.find((c) => c.homeAway === 'away');
  const odds = (comp.odds || [])[0] || (summary && (summary.pickcenter || [])[0]) || {};

  const sideFromSummary = (abbr) => {
    const players = (summary && summary.boxscore && summary.boxscore.players) || [];
    const blk = players.find((p) => p.team.abbreviation === abbr);
    return blk ? parseBox(blk) : [];
  };
  const lines = (c) => (c.linescores || []).map((l) => (l.displayValue != null ? l.displayValue : l.value));

  // win probability series (home), sampled
  const wpArr = (summary && summary.winprobability) || [];
  let winHistory = [], winHome = null;
  if (wpArr.length) {
    const step = Math.max(1, Math.floor(wpArr.length / 40));
    for (let i = 0; i < wpArr.length; i += step) winHistory.push(wpArr[i].homeWinPercentage);
    winHistory.push(wpArr[wpArr.length - 1].homeWinPercentage);
    winHome = wpArr[wpArr.length - 1].homeWinPercentage;
  } else if (summary && summary.predictor) {
    winHome = (+summary.predictor.homeTeam.gameProjection || 50) / 100;
  }

  const teamInfo = (c) => {
    const recs = c.records || c.record || [];
    return {
      abbr: c.team.abbreviation,
      name: c.team.shortDisplayName || c.team.name || c.team.displayName,
      score: +c.score || 0,
      record: Array.isArray(recs) ? ((recs[0] || {}).summary || '') : '',
      color: c.team.color ? '#' + c.team.color : '#8E8E93',
      logo: c.team.logo,
      lines: lines(c),
    };
  };

  return {
    id: scoreEvent.id,
    state: status.type.state,            // 'pre' | 'in' | 'post'
    detail: status.type.shortDetail,
    period: status.period,
    clock: status.displayClock,
    home: teamInfo(homeC),
    away: teamInfo(awayC),
    boxHome: sideFromSummary(homeC.team.abbreviation),
    boxAway: sideFromSummary(awayC.team.abbreviation),
    winHome, winHistory,
    spread: odds.details || odds.spread || '',
    ou: odds.overUnder != null ? odds.overUnder : '',
    leaders: (summary && summary.leaders) || [],
  };
}

// ── base loader: everything that doesn't depend on the current selection ─────
async function loadBase() {
  // 1. scoreboard for season + today's games
  const scoreboard = await fetchJson(ESPN_SITE + '/scoreboard', 30000);
  const league = (scoreboard.leagues || [])[0] || {};
  const season = (scoreboard.season || league.season || {});
  const seasonYear = season.year || new Date().getFullYear();
  const seasonLabel = (league.season && league.season.displayName) ||
    ((seasonYear - 1) + '–' + String(seasonYear).slice(2));
  const STATS_QS = 'region=us&lang=en&contentorigin=espn&isqualified=false&seasontype=2&season=' + seasonYear;

  const events = scoreboard.events || [];
  const liveCount = events.filter((e) => e.competitions[0].status.type.state === 'in').length;
  const todayLabel = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

  // 2. parallel: two pages of player stats + standings.
  // NOTE: the /teams *collection* endpoint does not send CORS headers, so we
  // build the team index from the standings payload (logos included) instead,
  // and fetch real team colours from the per-team endpoint (which does allow CORS).
  const [statsP1, statsP2, standingsRaw] = await Promise.all([
    fetchJson(ESPN_WEB + '/statistics/byathlete?' + STATS_QS + '&page=1&limit=500&sort=offensive.avgPoints%3Adesc'),
    fetchJson(ESPN_WEB + '/statistics/byathlete?' + STATS_QS + '&page=2&limit=500&sort=offensive.avgPoints%3Adesc').catch(() => ({ athletes: [] })),
    fetchJson(ESPN_V2 + '/standings?level=0', 120000),
  ]);

  // teams index from standings (covers all 30 teams)
  const teamsById = {}, teamsByAbbr = {};
  (standingsRaw.children || []).forEach((conf) => {
    ((conf.standings && conf.standings.entries) || []).forEach((e) => {
      const tm = e.team;
      const info = {
        id: tm.id, abbr: tm.abbreviation, name: tm.displayName, short: tm.shortDisplayName,
        color: '#0A84FF', alt: '#0a3a80',
        logo: (tm.logos && tm.logos[0] && tm.logos[0].href) || null,
      };
      teamsById[tm.id] = info; teamsByAbbr[tm.abbreviation] = info;
    });
  });

  const players = parseByAthlete([statsP1, statsP2]);
  const playersById = {};
  players.forEach((p) => { playersById[p.id] = p; });
  const standings = parseStandings(standingsRaw, teamsById);

  // global percentile pools for the radar (stable rotation-player population)
  const pool = players.filter((p) => p.gp >= 5 && p.min >= 18);
  const sortedBy = (sel) => pool.map(sel).sort((a, b) => a - b);
  const radarPools = {
    scoring: sortedBy((p) => p.ppg), playmaking: sortedBy((p) => p.apg),
    rebounding: sortedBy((p) => p.rpg), defense: sortedBy((p) => p.spg + p.bpg),
    efficiency: sortedBy((p) => p.ts), volume: sortedBy((p) => p.min),
  };

  // chosen game for the live screen
  let game0 = pickGame(events);
  if (game0 && game0.competitions[0].status.type.state === 'pre') {
    const fin = await findRecentFinal();
    if (fin) game0 = fin;
  }
  const summaryRaw = game0 ? await fetchJson(ESPN_SITE + '/summary?event=' + game0.id, 20000).catch(() => null) : null;
  const game = game0 ? parseGame(game0, summaryRaw) : null;

  const defaultPlayerId = players[0] ? players[0].id : null;
  const defaultTeamId = (players[0] && (teamsByAbbr[players[0].teamAbbr] || {}).id) || null;

  return {
    meta: { seasonYear, seasonLabel, todayLabel, liveCount },
    teamsById, teamsByAbbr, players, playersById, standings, radarPools,
    game, gameEventId: game0 ? game0.id : null,
    defaultPlayerId, defaultTeamId,
  };
}

// ── build the player bundle (player + game log + radar) for any player id ────
async function buildPlayerBundle(base, playerId) {
  const src = base.playersById[playerId];
  if (!src) return null;
  const player = Object.assign({}, src);
  const teamInfo = base.teamsByAbbr[player.teamAbbr] || {};
  const teamId = teamInfo.id;

  const [gamelogRaw, rosterRaw] = await Promise.all([
    fetchJson(ESPN_WEB + '/athletes/' + player.id + '/gamelog?season=' + base.meta.seasonYear, 120000).catch(() => ({})),
    teamId ? fetchJson(ESPN_SITE + '/teams/' + teamId + '/roster', 3600000).catch(() => ({})) : Promise.resolve({}),
  ]);
  const gamelog = parseGameLog(gamelogRaw);

  const bioById = {};
  (rosterRaw.athletes || []).forEach((a) => { bioById[a.id] = a; });
  const bio = bioById[player.id] || {};
  Object.assign(player, {
    number: bio.jersey || '',
    height: bio.displayHeight || '',
    weight: bio.displayWeight || '',
    age: bio.age || '',
    exp: bio.experience ? (bio.experience.years ? ordinal(bio.experience.years) : 'Rookie') : '',
    posFull: (bio.position && bio.position.displayName) ||
      (player.pos === 'G' ? 'Guard' : player.pos === 'F' ? 'Forward' : player.pos === 'C' ? 'Center' : ''),
  });

  const rp = base.radarPools;
  const radar = [
    { k: 'Scoring',    p: percentile(player.ppg, rp.scoring),               avg: 50 },
    { k: 'Playmaking', p: percentile(player.apg, rp.playmaking),            avg: 50 },
    { k: 'Rebounding', p: percentile(player.rpg, rp.rebounding),            avg: 50 },
    { k: 'Defense',    p: percentile(player.spg + player.bpg, rp.defense),  avg: 50 },
    { k: 'Efficiency', p: percentile(player.ts, rp.efficiency),             avg: 50 },
    { k: 'Volume',     p: percentile(player.min, rp.volume),                avg: 50 },
  ];
  return { player, gamelog, radar };
}

// ── build the team bundle for any team id ────────────────────────────────────
async function buildTeamBundle(base, teamId) {
  const teamInfo = Object.assign({}, base.teamsById[teamId] || {});
  const roster = base.players.filter((p) => p.teamAbbr === teamInfo.abbr).sort((a, b) => b.ppg - a.ppg);

  const [teamDetailRaw, gamelogRaw] = await Promise.all([
    teamId ? fetchJson(ESPN_SITE + '/teams/' + teamId, 3600000).catch(() => null) : Promise.resolve(null),
    roster[0] ? fetchJson(ESPN_WEB + '/athletes/' + roster[0].id + '/gamelog?season=' + base.meta.seasonYear, 120000).catch(() => ({})) : Promise.resolve({}),
  ]);

  const detail = teamDetailRaw && teamDetailRaw.team;
  if (detail) {
    if (detail.color) teamInfo.color = '#' + detail.color;
    if (detail.alternateColor) teamInfo.alt = '#' + detail.alternateColor;
    if (!teamInfo.logo && detail.logos && detail.logos[0]) teamInfo.logo = detail.logos[0].href;
  }

  const teamStanding = [...(base.standings.east || []), ...(base.standings.west || [])].find((s) => s.id === teamId) || {};
  const agg = roster.reduce((a, p) => {
    a.fgm += p.fgm; a.fga += p.fga; a.tpm += p.tpm; a.tpa += p.tpa; a.fta += p.fta; a.tov += p.tov; a.ast += p.ast; return a;
  }, { fgm: 0, fga: 0, tpm: 0, tpa: 0, fta: 0, tov: 0, ast: 0 });
  const four = {
    efg: agg.fga ? round(((agg.fgm + 0.5 * agg.tpm) / agg.fga) * 100) : 0,
    threeRate: agg.fga ? round((agg.tpa / agg.fga) * 100) : 0,
    ftRate: agg.fga ? round((agg.fta / agg.fga) * 100) : 0,
    astTo: agg.tov ? round(agg.ast / agg.tov) : 0,
  };
  // margin trend from the team's leading scorer's game log (his games == team games)
  const tgl = parseGameLog(gamelogRaw);
  const marginTrend = tgl.map((g) => {
    const teamHome = String(g.homeTeamId) === String(g.teamId);
    const margin = teamHome ? g.homeScore - g.awayScore : g.awayScore - g.homeScore;
    return { d: g.d, opp: g.opp, pts: margin };
  });

  const team = {
    id: teamId,
    abbr: teamInfo.abbr,
    name: teamInfo.name || '',
    color: teamInfo.color || '#0A84FF',
    alt: teamInfo.alt || '#0a3a80',
    logo: teamInfo.logo,
    record: teamStanding.w != null ? teamStanding.w + '-' + teamStanding.l : '',
    seed: teamStanding.seed,
    pct: teamStanding.pct,
    conf: (base.standings.west || []).some((s) => s.id === teamId) ? 'Western' : 'Eastern',
    streak: teamStanding.streak,
    ppg: teamStanding.ppg, oppg: teamStanding.oppg, diff: teamStanding.diff,
    four, roster, marginTrend,
  };
  return { team };
}

// ── React context + provider ─────────────────────────────────────────────────
const DataCtx = React.createContext(null);

function DataProvider({ children }) {
  const [state, setState] = React.useState({ status: 'loading', base: null, error: null });
  const [screen, setScreen] = React.useState('player');
  const [playerId, setPlayerId] = React.useState(null);
  const [teamId, setTeamId] = React.useState(null);
  const [playerBundle, setPlayerBundle] = React.useState(null);
  const [teamBundle, setTeamBundle] = React.useState(null);
  const [selecting, setSelecting] = React.useState(false);

  const load = React.useCallback(() => {
    setState({ status: 'loading', base: null, error: null });
    setPlayerBundle(null); setTeamBundle(null);
    loadBase()
      .then(async (base) => {
        const pid = base.defaultPlayerId, tid = base.defaultTeamId;
        const [pb, tb] = await Promise.all([
          pid ? buildPlayerBundle(base, pid) : Promise.resolve(null),
          tid ? buildTeamBundle(base, tid) : Promise.resolve(null),
        ]);
        setPlayerId(pid); setTeamId(tid);
        setPlayerBundle(pb); setTeamBundle(tb);
        setState({ status: 'ready', base, error: null });
      })
      .catch((err) => { console.error(err); setState((s) => ({ status: 'error', base: s.base, error: err })); });
  }, []);

  React.useEffect(() => { load(); }, [load]);

  // select any player (and switch its team dashboard to that player's team)
  const selectPlayer = React.useCallback((id) => {
    const base = state.base;
    if (!base || !base.playersById[id]) return;
    const tid = (base.teamsByAbbr[base.playersById[id].teamAbbr] || {}).id;
    setSelecting(true); setScreen('player'); setPlayerId(id); if (tid) setTeamId(tid);
    Promise.all([
      buildPlayerBundle(base, id),
      tid ? buildTeamBundle(base, tid) : Promise.resolve(null),
    ]).then(([pb, tb]) => { if (pb) setPlayerBundle(pb); if (tb) setTeamBundle(tb); })
      .catch((e) => console.error(e))
      .finally(() => setSelecting(false));
  }, [state.base]);

  // select any team (team dashboard only)
  const selectTeam = React.useCallback((id) => {
    const base = state.base;
    if (!base || !base.teamsById[id]) return;
    setSelecting(true); setScreen('team'); setTeamId(id);
    buildTeamBundle(base, id)
      .then((tb) => { if (tb) setTeamBundle(tb); })
      .catch((e) => console.error(e))
      .finally(() => setSelecting(false));
  }, [state.base]);

  const data = state.base
    ? Object.assign({}, state.base, playerBundle || {}, teamBundle || {},
        { selectedPlayerId: playerId, selectedTeamId: teamId })
    : null;

  // not truly "ready" until the initial bundles have populated
  const status = (state.status === 'ready' && (!playerBundle || !teamBundle)) ? 'loading' : state.status;

  return (
    <DataCtx.Provider value={{ status, data, error: state.error, reload: load, screen, setScreen, selectPlayer, selectTeam, selecting }}>
      {children}
    </DataCtx.Provider>
  );
}

const useData = () => React.useContext(DataCtx);

// re-fetch just the live game summary (used for live polling)
async function refreshGame(eventId) {
  if (!eventId) return null;
  _cache.delete(ESPN_SITE + '/summary?event=' + eventId);
  _cache.delete(ESPN_SITE + '/scoreboard');
  const [scoreboard, summary] = await Promise.all([
    fetchJson(ESPN_SITE + '/scoreboard', 0),
    fetchJson(ESPN_SITE + '/summary?event=' + eventId, 0),
  ]);
  const ev = (scoreboard.events || []).find((e) => e.id === eventId);
  if (!ev) return null;
  return parseGame(ev, summary);
}

Object.assign(window, { DataProvider, useData, DataCtx, refreshGame, fetchJson });


// ─────────── charts.jsx ───────────

// ── Chart components. All pure SVG, dark-friendly, with draw-in animations. ──

const ACCENT = '#0A84FF';
const GRID = 'rgba(255,255,255,0.06)';
const LABEL = '#6d6d78';

// Small reusable "reveal on mount" hook
function useReveal(dep = 0) {
  const [on, setOn] = React.useState(false);
  React.useEffect(() => {
    const id = requestAnimationFrame(() => requestAnimationFrame(() => setOn(true)));
    return () => cancelAnimationFrame(id);
  }, [dep]);
  return on;
}

// ── Sparkline ────────────────────────────────────────────────────────────
function Spark({ data, w = 120, h = 28, color = ACCENT, area = true }) {
  const min = Math.min(...data), max = Math.max(...data);
  const pad = 2;
  const pts = data.map((v, i) => {
    const x = pad + (i / (data.length - 1)) * (w - pad * 2);
    const y = pad + (1 - (v - min) / (max - min || 1)) * (h - pad * 2);
    return [x, y];
  });
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const fill = d + ` L ${w - pad} ${h - pad} L ${pad} ${h - pad} Z`;
  return (
    <svg width={w} height={h} style={{ display: 'block' }}>
      {area && <path d={fill} fill={color} opacity="0.12" />}
      <path d={d} fill="none" stroke={color} strokeWidth="1.5" />
    </svg>
  );
}

// ── Line/Area: points over last 15 games ─────────────────────────────────
function LineArea({ data, height = 220, accessor = (d) => d.pts, label = 'PTS', unit = '' }) {
  const [hover, setHover] = React.useState(null);
  const on = useReveal();
  const pad = { t: 20, r: 16, b: 28, l: 36 };
  const w = 720, h = height;
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const vals = data.map(accessor);
  const lo = Math.min(...vals) - 4, hi = Math.max(...vals) + 4;
  const x = (i) => pad.l + (i / (data.length - 1)) * iw;
  const y = (v) => pad.t + (1 - (v - lo) / (hi - lo)) * ih;
  const pts = data.map((d, i) => [x(i), y(accessor(d))]);
  const path = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const fill = path + ` L ${pad.l + iw} ${pad.t + ih} L ${pad.l} ${pad.t + ih} Z`;

  const ticks = 4;
  const tickVals = Array.from({ length: ticks + 1 }, (_, i) => lo + ((hi - lo) * i) / ticks);
  const avg = vals.reduce((a, b) => a + b, 0) / vals.length;

  return (
    <svg viewBox={`0 0 ${w} ${h}`} width="100%" style={{ display: 'block' }}>
      <defs>
        <linearGradient id="la-fill" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%"   stopColor={ACCENT} stopOpacity="0.35" />
          <stop offset="100%" stopColor={ACCENT} stopOpacity="0" />
        </linearGradient>
        <clipPath id="la-clip">
          <rect x={pad.l} y="0" width={on ? iw : 0} height={h} style={{ transition: 'width 1.1s cubic-bezier(.2,.7,.2,1)' }} />
        </clipPath>
      </defs>

      {/* grid */}
      {tickVals.map((v, i) => {
        const yy = y(v);
        return (
          <g key={i}>
            <line x1={pad.l} x2={pad.l + iw} y1={yy} y2={yy} stroke={GRID} strokeDasharray="2 4" />
            <text x={pad.l - 8} y={yy + 3} textAnchor="end" fontSize="10" fontFamily="JetBrains Mono" fill={LABEL}>{v.toFixed(0)}</text>
          </g>
        );
      })}

      {/* avg */}
      <line x1={pad.l} x2={pad.l + iw} y1={y(avg)} y2={y(avg)} stroke="rgba(255,255,255,0.22)" strokeDasharray="1 3" />
      <text x={pad.l + iw - 4} y={y(avg) - 4} fontSize="9" fontFamily="JetBrains Mono" fill="#9aa0a6" textAnchor="end">
        AVG {avg.toFixed(1)}
      </text>

      {/* x labels: every 3rd */}
      {data.map((d, i) => i % 3 === 0 && (
        <text key={i} x={x(i)} y={h - 8} textAnchor="middle" fontSize="9" fontFamily="JetBrains Mono" fill={LABEL}>{d.d}</text>
      ))}

      <g clipPath="url(#la-clip)">
        <path d={fill} fill="url(#la-fill)" />
        <path d={path} fill="none" stroke={ACCENT} strokeWidth="2" />
      </g>

      {/* points */}
      {pts.map((p, i) => (
        <g key={i}
           onMouseEnter={() => setHover(i)}
           onMouseLeave={() => setHover(null)}
           style={{ cursor: 'pointer' }}>
          <circle cx={p[0]} cy={p[1]} r="8" fill="transparent" />
          <circle cx={p[0]} cy={p[1]} r={hover === i ? 4 : 2.5}
            fill={ACCENT}
            style={{ transition: 'r 0.15s, opacity 0.6s', opacity: on ? 1 : 0, transitionDelay: `${i * 40 + 400}ms` }} />
        </g>
      ))}

      {/* hover tooltip */}
      {hover !== null && (
        <g>
          <line x1={pts[hover][0]} x2={pts[hover][0]} y1={pad.t} y2={pad.t + ih} stroke="rgba(255,255,255,0.15)" />
          <g transform={`translate(${Math.min(pts[hover][0] + 10, w - 130)} ${Math.max(pts[hover][1] - 40, pad.t)})`}>
            <rect width="120" height="38" rx="8" fill="#1a1a20" stroke="rgba(255,255,255,0.1)" />
            <text x="10" y="15" fontSize="10" fontFamily="JetBrains Mono" fill="#9aa0a6">{data[hover].d} · vs {data[hover].opp}</text>
            <text x="10" y="30" fontSize="12" fontFamily="JetBrains Mono" fill="#fff" fontWeight="600">
              {label}: {accessor(data[hover])}{unit}
            </text>
          </g>
        </g>
      )}
    </svg>
  );
}

// ── Radar ─────────────────────────────────────────────────────────────────
function Radar({ data, size = 280 }) {
  const on = useReveal();
  const cx = size / 2, cy = size / 2, r = size / 2 - 34;
  const n = data.length;
  const ang = (i) => -Math.PI / 2 + (i * 2 * Math.PI) / n;
  const point = (v, i, rad = r) => [cx + Math.cos(ang(i)) * rad * (v / 100), cy + Math.sin(ang(i)) * rad * (v / 100)];
  const poly = (vals) => vals.map((v, i) => point(v, i).join(',')).join(' ');

  return (
    <svg viewBox={`0 0 ${size} ${size}`} width="100%" style={{ display: 'block' }}>
      {[25, 50, 75, 100].map((t) => (
        <polygon key={t}
          points={Array.from({ length: n }, (_, i) => point(t, i).join(',')).join(' ')}
          fill="none" stroke={GRID} />
      ))}
      {data.map((_, i) => {
        const [x, y] = point(100, i);
        return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke={GRID} />;
      })}
      {/* avg */}
      <polygon
        points={poly(data.map((d) => d.avg))}
        fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.25)" strokeDasharray="2 3"
        style={{ transition: 'opacity 0.8s', opacity: on ? 1 : 0 }} />
      {/* player */}
      <polygon
        points={poly(data.map((d) => d.p))}

        {/* free-throw circle */}

        {/* three-point arc */}

      {visible.map((s, i) => (

  );
}

// ── Bar (four factors) ───────────────────────────────────────────────────
function HBar({ label, value, max, color = ACCENT, unit = '', rankPct = null }) {
  const on = useReveal();
  const pct = (value / max) * 100;
  return (
    <div style={{ display: 'grid', gridTemplateColumns: '110px 1fr 64px', gap: 10, alignItems: 'center', padding: '8px 0' }}>

        }} />

}

// ── Win probability wave (live) ──────────────────────────────────────────
function WinProb({ homeProb = 0.5, history = [], homeAbbr = 'HOME', awayAbbr = 'AWAY', homeColor = '#0A84FF', awayColor = '#8E8E93', height = 80 }) {
  const on = useReveal();
  const w = 640, h = height;
  const series = history.length ? history : [homeProb, homeProb];
  const pts = series.map((v, i) => {
    const x = (i / Math.max(1, series.length - 1)) * w;
    // history values are home win probability in [0,1]
    const prob = Math.max(0, Math.min(1, v));
    const y = (1 - prob) * h;
    return [x, y];
  });
  const path = pts.map((p, i) => (i ? 'L' : 'M') + p.join(' ')).join(' ');
  return (
    <svg viewBox={`0 0 ${w} ${h}`} width="100%" style={{ display: 'block' }}>
      <defs>
        <linearGradient id="wp-home" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stopColor={homeColor} stopOpacity="0.45" />
          <stop offset="100%" stopColor={homeColor} stopOpacity="0" />
        </linearGradient>
        <clipPath id="wp-clip"><rect x="0" y="0" width={on ? w : 0} height={h} style={{ transition: 'width 1.2s ease' }} /></clipPath>
      </defs>
      <line x1="0" x2={w} y1={h/2} y2={h/2} stroke="rgba(255,255,255,0.08)" strokeDasharray="2 4" />
      <g clipPath="url(#wp-clip)">
        <path d={path + ` L ${w} ${h} L 0 ${h} Z`} fill="url(#wp-home)" />
        <path d={path} fill="none" stroke={homeColor} strokeWidth="2" />
      </g>
      <text x="8" y="14" fontSize="10" fontFamily="JetBrains Mono" fill="#9cc8ff">{homeAbbr} {Math.round(homeProb*100)}%</text>
      <text x={w - 8} y={h - 6} fontSize="10" fontFamily="JetBrains Mono" fill="#a9a9b2" textAnchor="end">{awayAbbr} {Math.round((1-homeProb)*100)}%</text>
    </svg>
  );
}

// ── Donut ────────────────────────────────────────────────────────────────
function Donut({ pct, label, sub, size = 120, color = ACCENT }) {
  const on = useReveal();
  const r = (size - 18) / 2;
  const c = 2 * Math.PI * r;
  return (
    <svg viewBox={`0 0 ${size} ${size}`} width={size} height={size}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth="8" />
      <circle cx={size/2} cy={size/2} r={r} fill="none"
        stroke={color} strokeWidth="8" strokeLinecap="round"
        strokeDasharray={c}
        strokeDashoffset={on ? c - (c * pct / 100) : c}
        transform={`rotate(-90 ${size/2} ${size/2})`}
        style={{ transition: 'stroke-dashoffset 1.2s cubic-bezier(.2,.7,.2,1)' }} />
      <text x={size/2} y={size/2 - 2} textAnchor="middle" fontFamily="JetBrains Mono" fontSize="22" fill="#fff" fontWeight="600">{pct}</text>
      <text x={size/2} y={size/2 + 14} textAnchor="middle" fontFamily="Inter" fontSize="9" fill="#6d6d78" style={{ letterSpacing: '0.1em' }}>{label}</text>
    </svg>
  );
}

// league scoring leader). No hardcoded player data.

// Build a representative shot sample from the player's REAL season shooting
// splits. Locations are modeled (free APIs don't expose shot coordinates), but
// the attempt mix (2P vs 3P) and the make/miss rates reflect actual season data.
function genShots(player) {
  const seed = (player.id ? parseInt(String(player.id).slice(-5)) : 7) || 7;
  let x = seed;
  const r = () => (x = (x * 9301 + 49297) % 233280, x / 233280);
  const fga = player.fga || 0, fgm = player.fgm || 0;
  const tpa = player.tpa || 0, tpm = player.tpm || 0;
  const twoA = Math.max(0, fga - tpa), twoM = Math.max(0, fgm - tpm);
  const twoPct = twoA ? twoM / twoA : 0.5;
  const tpPct = tpa ? tpm / tpa : 0.36;
  const SAMPLE = 130;
  const scale = fga ? SAMPLE / fga : 0;
  const nTwo = Math.round(twoA * scale), nThree = Math.round(tpa * scale);
  const out = [];
  const nRim = Math.round(nTwo * 0.62), nMid = nTwo - nRim;
  for (let i = 0; i < nRim; i++) {
    const a = r() * Math.PI, d = r() * 48;
    out.push({ x: 250 + Math.cos(a) * d, y: 420 - Math.sin(a) * d, made: r() < twoPct + 0.1, zone: 'rim' });
  }
  for (let i = 0; i < nMid; i++) {
    const a = r() * Math.PI, d = 90 + r() * 80;
    out.push({ x: 250 + Math.cos(a) * d, y: 420 - Math.sin(a) * d, made: r() < twoPct - 0.08, zone: 'mid' });
  }
  const corners = Math.round(nThree * 0.28);
  for (let i = 0; i < corners; i++) {
    const left = r() > 0.5;
    out.push({ x: (left ? 40 : 430) + r() * 30, y: 360 + r() * 60, made: r() < tpPct, zone: '3' });
  }
  for (let i = 0; i < nThree - corners; i++) {
    const a = 0.3 + r() * (Math.PI - 0.6), d = 238 + r() * 40;
    out.push({ x: 250 + Math.cos(a) * d, y: 420 - Math.sin(a) * d, made: r() < tpPct, zone: '3' });
  }
  return out;
}

// Team dashboard — featured team is the scoring leader's team. All values come
// from live ESPN standings + aggregated player stats. No hardcoded team data.

// Aggregate four-factor style metrics for every team from the player pool, so we
// can rank the featured team against the league.
function teamAggregates(players) {
  const by = {};
  players.forEach((p) => {
    if (!p.teamAbbr) return;
    const a = by[p.teamAbbr] || (by[p.teamAbbr] = { fgm: 0, fga: 0, tpm: 0, tpa: 0, fta: 0, tov: 0, ast: 0 });
    a.fgm += p.fgm; a.fga += p.fga; a.tpm += p.tpm; a.tpa += p.tpa; a.fta += p.fta; a.tov += p.tov; a.ast += p.ast;
  });
  return Object.entries(by).map(([abbr, a]) => ({
    abbr,
    efg: a.fga ? ((a.fgm + 0.5 * a.tpm) / a.fga) * 100 : 0,
    threeRate: a.fga ? (a.tpa / a.fga) * 100 : 0,
    ftRate: a.fga ? (a.fta / a.fga) * 100 : 0,
    astTo: a.tov ? a.ast / a.tov : 0,
  }));
}

    const sorted = aggs.map((a) => a[metric]).sort((a, b) => a - b);

// Live game screen — real scoreboard + box score + win probability from ESPN.
// If a game is in progress it polls every 15s; otherwise it shows the most
// recent final (or the next scheduled game). No hardcoded game data.

function LiveScreen() {
  const ctx = useData();
  const initial = ctx && ctx.data ? ctx.data.game : null;
  const eventId = ctx && ctx.data ? ctx.data.gameEventId : null;
  const [game, setGame] = React.useState(initial);
  const [tab, setTab] = React.useState('home');

  React.useEffect(() => { setGame(initial); }, [eventId]);

  // poll while the game is live
  React.useEffect(() => {
    if (!game || game.state !== 'in' || !eventId) return;
    const id = setInterval(() => {
      refreshGame(eventId).then((g) => { if (g) setGame(g); }).catch(() => {});
    }, 15000);
    return () => clearInterval(id);
  }, [game && game.state, eventId]);

  if (!ctx || ctx.status === 'loading' || !ctx.data) return <Loading label="Loading game…" />;
  if (!game) return <div className="content"><div className="card" style={{ padding: 40 }}><Empty label="No NBA games scheduled" /></div></div>;

  const lead = game.home.score - game.away.score;
  const isPre = game.state === 'pre';
  const isPost = game.state === 'post';
  const statusLabel = isPre ? 'SCHEDULED' : (isPost ? 'FINAL' : 'LIVE');
  const homeProb = game.winHome != null ? game.winHome : 0.5;

  const allBox = [...(game.boxHome || []), ...(game.boxAway || [])];
  const topPerf = allBox.slice().sort((a, b) => b.pts - a.pts).slice(0, 5);

  const quarters = Math.max(game.home.lines.length, game.away.lines.length, 4);
  const qHeads = Array.from({ length: quarters }, (_, i) => 'Q' + (i + 1)).concat('T');

  return (
    <div className="content">
      {/* Scoreboard */}
      <div className="card" style={{ padding: 26, position: 'relative', overflow: 'hidden' }}>
        <div style={{ position: 'absolute', inset: 0, background: 'radial-gradient(600px 280px at 50% 0%, rgba(255,159,10,0.06), transparent 60%)' }} />
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, marginBottom: 16, position: 'relative', flexWrap: 'wrap' }}>
          <span className={`chip ${statusLabel === 'LIVE' ? 'live' : ''}`}>{statusLabel === 'LIVE' ? <span className="pulse-dot" /> : null} {statusLabel}</span>
          <span className="chip">{game.detail}</span>
          {game.spread ? <span className="chip">SPREAD {game.spread}</span> : null}
          {game.ou !== '' ? <span className="chip">O/U {game.ou}</span> : null}
        </div>

        <div style={{ display: 'grid', gridTemplateColumns: '1fr auto 1fr', gap: 32, alignItems: 'center', position: 'relative' }}>
          {/* Away */}
          <div style={{ textAlign: 'right', display: 'flex', flexDirection: 'column', alignItems: 'flex-end' }}>
            {game.away.logo ? <img src={game.away.logo} alt={game.away.abbr} style={{ width: 48, height: 48, objectFit: 'contain', marginBottom: 4 }} /> : null}
            <div style={{ fontSize: 11, color: 'var(--text-3)', fontFamily: 'JetBrains Mono', letterSpacing: '0.1em' }}>{game.away.record}</div>
            <div style={{ fontSize: 22, color: 'var(--text-2)', marginTop: 2 }}>{game.away.name}</div>
            <div style={{ fontFamily: 'JetBrains Mono', fontSize: 96, fontWeight: 600, lineHeight: 1, color: lead < 0 ? '#fff' : 'var(--text-2)', letterSpacing: '-0.04em', marginTop: 4 }}>{game.away.score}</div>
          </div>
          {/* Middle */}
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 10, width: 120 }}>
            <div style={{ fontSize: 10, color: 'var(--text-3)', fontFamily: 'JetBrains Mono', letterSpacing: '0.12em' }}>{isPre ? 'TIP-OFF' : 'SCORE'}</div>
            <div style={{ width: 1, height: 120, background: 'linear-gradient(180deg, transparent, rgba(255,255,255,0.2), transparent)' }} />
            <div style={{ fontSize: 10, color: 'var(--text-3)', fontFamily: 'JetBrains Mono' }}>Q BY Q</div>
          </div>
          {/* Home */}
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-start' }}>
            {game.home.logo ? <img src={game.home.logo} alt={game.home.abbr} style={{ width: 48, height: 48, objectFit: 'contain', marginBottom: 4 }} /> : null}
            <div style={{ fontSize: 11, color: 'var(--text-3)', fontFamily: 'JetBrains Mono', letterSpacing: '0.1em' }}>{game.home.record}</div>
            <div style={{ fontSize: 22, color: '#fff', marginTop: 2 }}>{game.home.name}</div>
            <div style={{ fontFamily: 'JetBrains Mono', fontSize: 96, fontWeight: 600, lineHeight: 1, color: lead > 0 ? '#fff' : 'var(--text-2)', letterSpacing: '-0.04em', marginTop: 4 }}>{game.home.score}</div>
          </div>
        </div>

        {/* Quarter scores */}
        {(game.home.lines.length || game.away.lines.length) ? (
          <div style={{ marginTop: 20, display: 'grid', gridTemplateColumns: `auto repeat(${qHeads.length}, 1fr)`, gap: 2, fontSize: 12, fontFamily: 'JetBrains Mono' }}>
            <div></div>
            {qHeads.map((q, i) => (
              <div key={i} style={{ textAlign: 'center', color: 'var(--text-3)', fontSize: 10, letterSpacing: '0.1em', padding: '6px 0' }}>{q}</div>
            ))}
            <div style={{ color: 'var(--text-2)', padding: '8px 0' }}>{game.away.abbr}</div>
            {Array.from({ length: quarters }).map((_, i) => (
              <div key={i} style={{ textAlign: 'center', padding: '8px 0', color: 'var(--text-2)' }}>{game.away.lines[i] != null ? game.away.lines[i] : '—'}</div>

            <div style={{ textAlign: 'center', padding: '8px 0', color: '#fff' }}>{game.away.score}</div>
            <div style={{ color: '#fff', padding: '8px 0' }}>{game.home.abbr}</div>
            {Array.from({ length: quarters }).map((_, i) => (
              <div key={i} style={{ textAlign: 'center', padding: '8px 0', color: 'var(--text-2)' }}>{game.home.lines[i] != null ? game.home.lines[i] : '—'}</div>
            ))}
            <div style={{ textAlign: 'center', padding: '8px 0', color: '#fff' }}>{game.home.score}</div>
          </div>
        ) : null}
      </div>

      {/* Win prob + top performers */}
      <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr', gap: 18 }}>
        <div className="card">
          <div className="card-head">
            <h3>Win probability</h3>

          </div>
          <div style={{ padding: '14px 20px 18px' }}>
            {game.winHistory && game.winHistory.length
              ? <WinProb homeProb={homeProb} history={game.winHistory} homeAbbr={game.home.abbr} awayAbbr={game.away.abbr} />
              : (game.winHome != null
                  ? <div style={{ display: 'flex', gap: 14 }}>
                      <div style={{ flex: 1 }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 11, fontFamily: 'JetBrains Mono', color: 'var(--text-2)' }}>
                          <span>{game.home.abbr} {Math.round(homeProb * 100)}%</span>
                          <span>{game.away.abbr} {Math.round((1 - homeProb) * 100)}%</span>
                        </div>
                        <div style={{ marginTop: 6, height: 8, borderRadius: 999, overflow: 'hidden', display: 'flex' }}>
                          <div style={{ width: `${homeProb * 100}%`, background: '#0A84FF' }} />
                          <div style={{ width: `${(1 - homeProb) * 100}%`, background: '#3a3a42' }} />
                        </div>
                      </div>
                    </div>
                  : <Empty label="Win probability unavailable" />)}
          </div>
        </div>
        <div className="card">
          <div className="card-head"><h3>Top performers</h3><span className="sub">PTS</span></div>
          <div style={{ padding: '4px 18px 16px', display: 'flex', flexDirection: 'column', gap: 10, fontSize: 12 }}>
            {topPerf.length ? topPerf.map((p, i) => (
              <div key={i} style={{ display: 'grid', gridTemplateColumns: '1fr 28px 28px 28px', gap: 10, alignItems: 'center' }}>
                <div style={{ color: '#fff' }}>{p.n} <span style={{ color: 'var(--text-3)' }}>{p.p}</span></div>
                <div className="mono" style={{ textAlign: 'right', color: '#fff', fontWeight: 600 }}>{p.pts}</div>
                <div className="mono" style={{ textAlign: 'right', color: 'var(--text-2)' }}>{p.reb}</div>
                <div className="mono" style={{ textAlign: 'right', color: 'var(--text-2)' }}>{p.ast}</div>
              </div>
            )) : <Empty label="Box score at tip-off" />}
            {topPerf.length ? <div style={{ display: 'grid', gridTemplateColumns: '1fr 28px 28px 28px', gap: 10, fontSize: 9, color: 'var(--text-3)', fontFamily: 'JetBrains Mono', borderTop: '1px solid var(--line)', paddingTop: 6 }}>
              <div></div><div style={{ textAlign: 'right' }}>PTS</div><div style={{ textAlign: 'right' }}>REB</div><div style={{ textAlign: 'right' }}>AST</div>
            </div> : null}
          </div>
        </div>
      </div>

      {/* Box score */}
      <div className="card">
        <div className="card-head">
          <h3>Box score</h3>
          <div style={{ marginLeft: 'auto' }} className="seg">
            <button className={tab === 'home' ? 'on' : ''} onClick={() => setTab('home')}>{game.home.abbr}</button>
            <button className={tab === 'away' ? 'on' : ''} onClick={() => setTab('away')}>{game.away.abbr}</button>
          </div>
        </div>
        {(() => {
          const box = tab === 'home' ? game.boxHome : game.boxAway;
          if (!box || !box.length) return <div style={{ padding: 24 }}><Empty label="Box score available once the game starts" /></div>;
          return (
            <div style={{ overflow: 'auto', borderTop: '1px solid var(--line)' }}>
              <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 12, fontFamily: 'JetBrains Mono' }}>
                <thead>
                  <tr style={{ color: 'var(--text-3)', fontSize: 10, letterSpacing: '0.1em', fontFamily: 'Inter' }}>
                    {['PLAYER','MIN','PTS','REB','AST','FG','3PT','+/−'].map(h => (
                      <th key={h} style={{ textAlign: h === 'PLAYER' ? 'left' : 'right', padding: '10px 14px', fontWeight: 500, borderBottom: '1px solid var(--line)' }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {box.map((p, i) => (
                    <tr key={i} style={{ borderBottom: '1px solid var(--line)' }}>
                      <td style={{ padding: '10px 14px', fontFamily: 'Inter', color: '#fff' }}>{p.n} <span style={{ color: 'var(--text-3)' }}>{p.p}</span></td>
                      <td style={{ padding: '10px 14px', textAlign: 'right', color: 'var(--text-2)' }}>{p.min}</td>
                      <td style={{ padding: '10px 14px', textAlign: 'right', color: '#fff', fontWeight: 500 }}>{p.pts}</td>
                      <td style={{ padding: '10px 14px', textAlign: 'right', color: 'var(--text-2)' }}>{p.reb}</td>
                      <td style={{ padding: '10px 14px', textAlign: 'right', color: 'var(--text-2)' }}>{p.ast}</td>
                      <td style={{ padding: '10px 14px', textAlign: 'right', color: 'var(--text-2)' }}>{p.fg}</td>
                      <td style={{ padding: '10px 14px', textAlign: 'right', color: 'var(--text-2)' }}>{p.t3}</td>
                      <td style={{ padding: '10px 14px', textAlign: 'right', color: p.pm > 0 ? 'var(--good)' : (p.pm < 0 ? 'var(--bad)' : 'var(--text-3)') }}>{p.pm > 0 ? '+' : ''}{p.pm}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          );
        })()}
      </div>
    </div>
  );
}

window.LiveScreen = LiveScreen;


// ─────────── app.jsx ───────────

const { useState, useEffect } = React;

// ── shared status components (hoisted; used by every screen) ─────────────────
function Loading({ label = 'Loading…' }) {
  return (
    <div className="content">
      <div className="card" style={{ padding: 60, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 16 }}>
        <div className="spinner" />
        <div style={{ fontFamily: 'JetBrains Mono', fontSize: 12, color: 'var(--text-3)', letterSpacing: '0.1em' }}>{label.toUpperCase()}</div>
      </div>
    </div>
  );
}
function Empty({ label = 'No data' }) {
  return (
    <div style={{ padding: '30px 0', textAlign: 'center', fontFamily: 'JetBrains Mono', fontSize: 12, color: 'var(--text-3)' }}>{label}</div>
  );
}
function ErrorScreen({ error, onRetry }) {
  return (
    <div className="content">
      <div className="card" style={{ padding: 50, textAlign: 'center' }}>
        <div style={{ fontSize: 15, color: 'var(--bad)', marginBottom: 8 }}>Couldn’t load live NBA data</div>
        <div style={{ fontFamily: 'JetBrains Mono', fontSize: 12, color: 'var(--text-3)', marginBottom: 20 }}>{String(error && error.message || error)}</div>
        <button className="retry-btn" onClick={onRetry}>Retry</button>
      </div>
    </div>
  );
}

// ── live player search ───────────────────────────────────────────────────────
function SearchOverlay({ players, onClose, onSelect }) {
  const [q, setQ] = React.useState('');
  const inputRef = React.useRef(null);
  React.useEffect(() => { inputRef.current && inputRef.current.focus(); }, []);
  React.useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);
  const results = q.trim().length < 1 ? [] :
    players.filter((p) => p.name.toLowerCase().includes(q.toLowerCase())).slice(0, 8);
  return (
    <div className="search-overlay" onClick={onClose}>
      <div className="search-modal" onClick={(e) => e.stopPropagation()}>
        <div className="search-input">
          <Icon name="search" size={15} />
          <input ref={inputRef} value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search any NBA player…" />
          <span className="kbd">ESC</span>
        </div>
        <div className="search-results">
          {q && !results.length ? <div style={{ padding: 18, color: 'var(--text-3)', fontSize: 13 }}>No players found</div> : null}
          {results.map((p) => (
            <div key={p.id} className="search-row" style={{ cursor: 'pointer' }} onClick={() => onSelect(p.id)}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                {p.headshot ? <img src={p.headshot} alt="" style={{ width: 28, height: 28, borderRadius: '50%', objectFit: 'cover', background: 'rgba(255,255,255,0.05)' }} /> : null}
                <div>
                  <div style={{ color: '#fff', fontSize: 13 }}>{p.name}</div>
                  <div style={{ color: 'var(--text-3)', fontSize: 11, fontFamily: 'JetBrains Mono' }}>{p.teamAbbr} · {p.pos}</div>
                </div>
              </div>
              <div style={{ display: 'flex', gap: 16, fontFamily: 'JetBrains Mono', fontSize: 12 }}>
                {[['PTS', p.ppg], ['REB', p.rpg], ['AST', p.apg], ['FG%', p.fg]].map(([l, v]) => (
                  <div key={l} style={{ textAlign: 'right' }}>
                    <div style={{ color: 'var(--text-3)', fontSize: 9 }}>{l}</div>
                    <div style={{ color: '#fff' }}>{v}</div>
                  </div>
                ))}
              </div>
            </div>
          ))}
          {!q ? <div style={{ padding: 18, color: 'var(--text-3)', fontSize: 12, fontFamily: 'JetBrains Mono' }}>Type to search the full league…</div> : null}
        </div>
      </div>
    </div>
  );
}

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{"material":"glass"}/*EDITMODE-END*/;

function AppInner() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [searchOpen, setSearchOpen] = useState(false);
  const ctx = useData();
  const data = ctx && ctx.data;
  const screen = ctx ? ctx.screen : 'player';
  const setScreen = ctx ? ctx.setScreen : () => {};

  // ⌘K / Ctrl+K opens search
  useEffect(() => {
    const onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); setSearchOpen(true); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const Screen = { player: PlayerScreen, team: TeamScreen, leaders: LeadersScreen, live: LiveScreen }[screen];

  const player = data && data.player;
  const team = data && data.team;
  const game = data && data.game;
  const meta = (data && data.meta) || {};

  const NAV = [
    { id: 'player',  label: 'Player',         icon: 'player',  section: 'Workspace', count: player ? (player.number ? '#' + player.number : player.teamAbbr) : null },
    { id: 'team',    label: 'Team dashboard', icon: 'team',    section: 'Workspace', count: team ? team.abbr : null },
    { id: 'leaders', label: 'League leaders', icon: 'leaders', section: 'League' },
    { id: 'live',    label: 'Live game',      icon: 'live',    section: 'League', count: game ? (game.state === 'in' ? 'LIVE' : (game.state === 'post' ? 'FINAL' : null)) : null },
  ];
  const sections = [...new Set(NAV.map(n => n.section))];

  const crumbs = {
    player: ['Workspace', 'Players', player ? player.name : '…'],
    team: ['Workspace', 'Teams', team ? (team.name || team.abbr) : '…'],
    leaders: ['League', 'Leaders', meta.seasonLabel || '…'],
    live: ['League', 'Live', game ? (game.away.abbr + ' @ ' + game.home.abbr) : '…'],
  }[screen];

  const liveText = meta.liveCount > 0 ? `LIVE · ${meta.liveCount} GAME${meta.liveCount > 1 ? 'S' : ''}` : 'NO LIVE GAMES';

  return (
    <div className={t.material === 'glass' ? 'glass' : 'flat'}>
      <div className="window">
        <div className="titlebar">
          <div className="traffic">
            <div className="dot c"></div>
            <div className="dot m"></div>
            <div className="dot x"></div>
          </div>
          <div className="title-center">
            <span className="logo">H</span>
            Hardwood · NBA Analytics
          </div>
          <div className="title-right">
            {meta.liveCount > 0 ? <span className="pulse-dot"></span> : null}
            <span>{liveText}</span>
            <span style={{ color: 'var(--text-3)', margin: '0 8px' }}>·</span>
            <span>{meta.todayLabel || ''}</span>
          </div>
        </div>

        <div className="app" data-screen-label={`${screen} view`}>
          <aside className="sidebar">
            {sections.map(sec => (
              <React.Fragment key={sec}>
                <div className="side-section">{sec}</div>
                {NAV.filter(n => n.section === sec).map(n => (
                  <div key={n.id}
                       className={`side-item ${screen === n.id ? 'active' : ''}`}
                       onClick={() => setScreen(n.id)}>
                    <span className="icon"><Icon name={n.icon} size={15} /></span>
                    {n.label}
                    {n.count && <span className="count">{n.count}</span>}
                  </div>
                ))}
              </React.Fragment>
            ))}

            <div className="side-section">Data</div>
            <div className="side-item" onClick={() => ctx && ctx.reload()}>
              <span className="icon"><Icon name="sparkle" size={15}/></span>
              Refresh data
              {ctx && ctx.status === 'refreshing' ? <span className="count">…</span> : null}
            </div>
            <div className="side-item" onClick={() => setSearchOpen(true)}>
              <span className="icon"><Icon name="search" size={15}/></span>
              Search players
              <span className="count">⌘K</span>
            </div>

            <div className="side-footer">
              <div className="avatar">N</div>
              <div className="meta">
                <div className="n">Live NBA data</div>
                <div className="s">ESPN · {meta.seasonLabel || '—'}</div>
              </div>
              <div style={{ marginLeft: 'auto' }}>
                <span className="pulse-dot" style={{ background: ctx && ctx.status === 'ready' ? 'var(--good)' : 'var(--text-3)' }} />
              </div>
            </div>
          </aside>

          <main className="main">
            <div className="topbar">
              <div className="crumbs">
                {crumbs.map((c, i) => (
                  <React.Fragment key={i}>
                    {i > 0 && <span className="sep">/</span>}
                    <span className={i === crumbs.length - 1 ? 'cur' : ''}>{c}</span>
                  </React.Fragment>
                ))}
              </div>
              <div className="search" style={{ marginLeft: 'auto', cursor: 'pointer' }} onClick={() => setSearchOpen(true)}>
                <Icon name="search" size={13} />
                <span>Search players…</span>
                <span className="kbd">⌘K</span>
              </div>
              {ctx && ctx.selecting
                ? <span style={{ fontFamily: 'JetBrains Mono', fontSize: 11, color: 'var(--accent)', letterSpacing: '0.1em' }}>UPDATING…</span>
                : null}
              <div style={{ color: 'var(--text-3)' }}><Icon name="bell" size={14} /></div>
            </div>

            {ctx && ctx.status === 'error' && !data
              ? <ErrorScreen error={ctx.error} onRetry={() => ctx.reload()} />
              : <Screen />}
          </main>
        </div>
      </div>

      {searchOpen && data ? <SearchOverlay players={data.players}
        onClose={() => setSearchOpen(false)}
        onSelect={(id) => { ctx.selectPlayer(id); setSearchOpen(false); }} /> : null}

      <TweaksPanel>
        <TweakSection label="Materials" />
        <TweakRadio label="Surface" value={t.material}
          options={['glass', 'flat']}
          onChange={(v) => setTweak('material', v)} />
      </TweaksPanel>
    </div>
  );
}

function App() {
  return (
    <DataProvider>
      <AppInner />
    </DataProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
